<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardvalia - 認証中</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #0f172a;
    color: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
    text-align: center;
    padding: 24px;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(255, 255, 255, 0.2);
    border-top-color: #818cf8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a { color: #a5b4fc; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <p>認証中です。アプリに戻ります…</p>
  <p><a id="manual-link" href="#">自動で戻らない場合はこちらをタップ</a></p>
  <script>
    (function () {
      var hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash;
      var target = 'com.hideyukikumura.cardvalia://oauth-callback' + (hash ? '#' + hash : '');
      document.getElementById('manual-link').href = target;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
