<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardvalia - フォルダを選択</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #0f172a;
    color: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
    text-align: center;
    padding: 24px;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(255, 255, 255, 0.2);
    border-top-color: #818cf8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a { color: #a5b4fc; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <p>フォルダ選択ツールを読み込み中です…</p>
  <p><a id="manual-link" href="#">開かない場合はこちらでキャンセルしてアプリに戻る</a></p>

  <script src="https://apis.google.com/js/api.js"></script>
  <script>
    (function () {
      var qs = new URLSearchParams(window.location.search);
      var token = qs.get('token');
      var apiKey = qs.get('key');

      function backToApp(id, name) {
        var target = 'com.hideyukikumura.cardvalia://folder-picker-callback';
        if (id) {
          target += '?id=' + encodeURIComponent(id) + '&name=' + encodeURIComponent(name || '');
        }
        window.location.replace(target);
      }

      document.getElementById('manual-link').addEventListener('click', function (e) {
        e.preventDefault();
        backToApp(null, null);
      });

      if (!token) {
        backToApp(null, null);
        return;
      }

      function showPicker() {
        var view = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
          .setSelectFolderEnabled(true)
          .setIncludeFolders(true)
          .setMode(google.picker.DocsViewMode.LIST)
          .setParent('root')
          .setOwnedByMe(true);

        var picker = new google.picker.PickerBuilder()
          .setOAuthToken(token)
          .setDeveloperKey(apiKey)
          .addView(view)
          .setTitle('名刺データの保存先フォルダを選択')
          .setCallback(function (data) {
            if (data.action === google.picker.Action.PICKED) {
              var doc = data.docs[0];
              backToApp(doc.id, doc.name);
            } else if (data.action === google.picker.Action.CANCEL) {
              backToApp(null, null);
            }
          })
          .build();
        picker.setVisible(true);
      }

      window.onload = function () {
        gapi.load('picker', { callback: showPicker });
      };
    })();
  </script>
</body>
</html>
